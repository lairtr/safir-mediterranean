# Builds the Angular site and publishes it to the `gh-pages` branch, which
# GitHub Pages serves. Run it from the Actions tab ("Deploy website" → Run
# workflow) whenever you want the live site to match `main`.
#
# One-time setup: Settings → Pages → Source: "Deploy from a branch",
# Branch: gh-pages, folder: / (root).
#
# Menu: the site loads prices live from Airtable, so menu changes don't need
# a deploy. With repository secrets AIRTABLE_TOKEN and AIRTABLE_BASE_ID set
# (Settings → Secrets and variables → Actions), each deploy also refreshes
# the built-in menu snapshot that search engines see.
name: Deploy website

on:
  workflow_dispatch:
    inputs:
      base_href:
        description: >-
          URL path the site is served from. Leave empty to detect it:
          "/" with a custom domain (public/CNAME) or a <user>.github.io repo,
          otherwise "/<repo-name>/".
        required: false
        default: ''

permissions:
  contents: write # push the built site to the gh-pages branch

concurrency:
  group: deploy-website
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # Only a yes/no flag here; the token itself is passed to one step below.
      HAS_AIRTABLE: ${{ secrets.AIRTABLE_TOKEN != '' }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Work out base href and site URL
        id: base
        env:
          INPUT_BASE: ${{ inputs.base_href }}
          REPO_NAME: ${{ github.event.repository.name }}
          OWNER: ${{ github.repository_owner }}
        run: |
          if [ -n "$INPUT_BASE" ]; then
            base="$INPUT_BASE"
          elif [ -f public/CNAME ] || [[ "$REPO_NAME" == *.github.io ]]; then
            base="/"
          else
            base="/$REPO_NAME/"
          fi
          # must start and end with a slash
          [[ "$base" == /* ]] || base="/$base"
          [[ "$base" == */ ]] || base="$base/"
          if [ -f public/CNAME ]; then
            host="$(tr -d '[:space:]' < public/CNAME)"
          else
            host="${OWNER,,}.github.io"
          fi
          echo "href=$base" >> "$GITHUB_OUTPUT"
          echo "url=https://${host}${base}" >> "$GITHUB_OUTPUT"
          echo "Base href: $base"
          echo "Site URL:  https://${host}${base}"

      - name: Snapshot the menu from Airtable
        # Uses the menu JSON committed in the repo when the secret isn't set.
        if: env.HAS_AIRTABLE == 'true'
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          AIRTABLE_BASE_ID: ${{ secrets.AIRTABLE_BASE_ID }}
        run: node scripts/fetch-menu.mjs

      - name: Build (prerenders Home, Menu and Order Online to static HTML)
        run: npx ng build --configuration production --base-href "${{ steps.base.outputs.href }}"

      - name: Prepare for GitHub Pages
        # Absolute URLs, sitemap.xml, robots.txt, 404.html fallback, .nojekyll
        run: node scripts/finalize-static.mjs "${{ steps.base.outputs.url }}"

      - name: Publish to gh-pages branch
        working-directory: dist/safir/browser
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA::7} from ${GITHUB_REF_NAME}"
          # Replace the branch each time: it only ever holds the latest build.
          git push -q --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages

      - name: Summary
        env:
          SITE_URL: ${{ steps.base.outputs.url }}
        run: |
          {
            echo "### Website published"
            echo ""
            echo "Built \`${GITHUB_SHA::7}\` and pushed it to the \`gh-pages\` branch."
            echo "Live at: ${SITE_URL} (Pages takes about a minute to update)"
          } >> "$GITHUB_STEP_SUMMARY"
