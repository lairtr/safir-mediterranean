# Builds the Angular site and publishes it to the `gh-pages` branch, which
# GitHub Pages serves. Run it from the Actions tab ("Deploy website" → Run
# workflow) whenever you want the live site to match `main`.
#
# One-time setup: Settings → Pages → Source: "Deploy from a branch",
# Branch: gh-pages, folder: / (root).
name: Deploy website

on:
  workflow_dispatch:
    inputs:
      base_href:
        description: >-
          URL path the site is served from. Leave empty to detect it:
          "/" with a custom domain (public/CNAME) or a <user>.github.io repo,
          otherwise "/<repo-name>/".
        required: false
        default: ''

permissions:
  contents: write # push the built site to the gh-pages branch

concurrency:
  group: deploy-website
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Work out base href
        id: base
        env:
          INPUT_BASE: ${{ inputs.base_href }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          if [ -n "$INPUT_BASE" ]; then
            base="$INPUT_BASE"
          elif [ -f public/CNAME ] || [[ "$REPO_NAME" == *.github.io ]]; then
            base="/"
          else
            base="/$REPO_NAME/"
          fi
          # must start and end with a slash
          [[ "$base" == /* ]] || base="/$base"
          [[ "$base" == */ ]] || base="$base/"
          echo "href=$base" >> "$GITHUB_OUTPUT"
          echo "Base href: $base"

      - name: Build
        run: npx ng build --configuration production --base-href "${{ steps.base.outputs.href }}"

      - name: Prepare for GitHub Pages
        working-directory: dist/safir/browser
        run: |
          # Pages has no server-side routing: serve the app for unknown paths
          # so links like /menu work when opened directly or refreshed.
          cp index.html 404.html
          # Serve files as-is (skip Jekyll processing).
          touch .nojekyll
          # Server configs for other hosts aren't used by Pages.
          rm -f _redirects .htaccess

      - name: Publish to gh-pages branch
        working-directory: dist/safir/browser
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA::7} from ${GITHUB_REF_NAME}"
          # Replace the branch each time: it only ever holds the latest build.
          git push -q --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages

      - name: Summary
        env:
          BASE: ${{ steps.base.outputs.href }}
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          {
            echo "### Website published"
            echo ""
            echo "Built \`${GITHUB_SHA::7}\` and pushed it to the \`gh-pages\` branch."
            if [ -f public/CNAME ]; then
              echo "Live at: https://$(cat public/CNAME)/"
            else
              echo "Live at: https://${owner}.github.io${BASE} (Pages takes about a minute to update)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
